
services:
  app:
    build: .
    container_name: mini-ecommerce-app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: mini-ecommerce-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: mini_ecommerce
      MARIADB_USER: ecommerce_user
      MARIADB_PASSWORD: ecommerce123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mini_ecommerce.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
